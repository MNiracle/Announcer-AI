<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Announcer AI - Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    🔐
                </div>

                <div>

                    
<div style="text-align:center; margin-bottom:20px;">

    <img
        src="images/logo.png"
        alt="Beamsknight Academy"
        style="
        width:80px;
        height:80px;
        object-fit:contain;
        border-radius:15px;
        "
    >

    <h1 style="margin-top:12px;">
        Beamsknight Academy
    </h1>

    <p style="color:#9ca3af;">
        Beamsknight Academy Anouncer
    </p>

</div>



                    <p>
                        Administrator Login
                    </p>

                </div>

            </div>

        </header>


        <main style="display:block;">

            <section
                class="announcement-section"
                style="
                max-width:500px;
                margin:50px auto;
                min-height:auto;
                "
            >

                <div class="section-title">

                    <div>

                        <span>
                            SECURE ACCESS
                        </span>

                        <h2>
                            Admin Login
                        </h2>

                    </div>

                </div>


                <div
                    style="
                    margin-top:30px;
                    "
                >

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        background:#060912;
                        color:white;
                        border:1px solid rgba(255,255,255,.1);
                        border-radius:10px;
                        "
                    >

                </div>


                <div
                    style="
                    margin-top:20px;
                    "
                >

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        background:#060912;
                        color:white;
                        border:1px solid rgba(255,255,255,.1);
                        border-radius:10px;
                        "
                    >

                </div>


                <button
                    class="announce-button"
                    id="loginButton"
                    style="margin-top:25px;"
                >
                    🔐 Login
                </button>


                <p
                    id="loginMessage"
                    style="
                    text-align:center;
                    margin-top:15px;
                    color:#d9534f;
                    "
                ></p>


                <a
                    href="index.html"
                    style="
                    display:block;
                    text-align:center;
                    margin-top:20px;
                    color:#8b84ff;
                    text-decoration:none;
                    "
                >
                    ← Back to Announcer
                </a>

            </section>

        </main>


        <footer>
            Announcer AI • Secure Administrator Access
        </footer>

    </div>


    <script src="login.js"></script>

</body>

</html>
